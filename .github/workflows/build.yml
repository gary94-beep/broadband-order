name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'      # 关键：改为 3.8

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包成单个 EXE
        run: |
          pyinstaller --onefile --console --name broadbandOrder --clean --noconfirm order.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: broadband_order_exe
          path: dist/broadbandOrder.exe
